version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: local-postgres
    environment:
      POSTGRES_DB: enterprisedb
      POSTGRES_USER: dbadmin
      POSTGRES_PASSWORD: VaultManagedPasswordSecure123
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dbadmin -d enterprisedb"]
      interval: 5s
      timeout: 5s
      retries: 5

  user-service:
    build:
      context: ../services/user-service
      dockerfile: Dockerfile
    container_name: user-service
    ports:
      - "8081:8081"
    environment:
      PORT: 8081
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: enterprisedb
      DB_USER: dbadmin
      DB_PASSWORD: VaultManagedPasswordSecure123
    depends_on:
      postgres:
        condition: service_healthy

  auth-service:
    build:
      context: ../services/auth-service
      dockerfile: Dockerfile
    container_name: auth-service
    ports:
      - "8082:8082"
    environment:
      PORT: 8082
      JWT_SECRET: my-super-secure-jwt-secret-key-2026
    depends_on:
      - postgres

  payment-service:
    build:
      context: ../services/payment-service
      dockerfile: Dockerfile
    container_name: payment-service
    ports:
      - "8083:8083"
    environment:
      PORT: 8083
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: enterprisedb
      DB_USER: dbadmin
      DB_PASSWORD: VaultManagedPasswordSecure123
    depends_on:
      postgres:
        condition: service_healthy

  notification-service:
    build:
      context: ../services/notification-service
      dockerfile: Dockerfile
    container_name: notification-service
    ports:
      - "8084:8084"
    environment:
      PORT: 8084
      SLACK_WEBHOOK_URL: https://hooks.slack.com/services/T00/B00/XXX
    depends_on:
      - postgres

  frontend:
    build:
      context: ../services/frontend
      dockerfile: Dockerfile
    container_name: local-frontend
    ports:
      - "3000:8080" # Maps local port 3000 to Container non-root port 8080
    depends_on:
      - user-service
      - auth-service
      - payment-service
      - notification-service

volumes:
  pgdata:
