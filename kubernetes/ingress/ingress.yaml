apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: enterprise-ingress
  namespace: production
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$1
    # Cert-manager TLS Issuer
    cert-manager.io/cluster-issuer: "letsencrypt-production"
    # AWS ALB Integration (if using AWS Load Balancer Controller)
    # alb.ingress.kubernetes.io/scheme: internet-facing
    # alb.ingress.kubernetes.io/target-type: ip
spec:
  tls:
  - hosts:
    - enterprise-microservices.net
    - "*.enterprise-microservices.net"
    secretName: enterprise-microservices-tls
  rules:
  - host: enterprise-microservices.net
    http:
      paths:
      # Frontend Application
      - path: /(.*)
        pathType: ImplementationSpecific
        backend:
          service:
            name: frontend
            port:
              number: 8080
      # User Microservice API
      - path: /api/v1/users(.*)
        pathType: ImplementationSpecific
        backend:
          service:
            name: user-service
            port:
              number: 8081
      # Auth Microservice API
      - path: /api/v1/auth(.*)
        pathType: ImplementationSpecific
        backend:
          service:
            name: auth-service
            port:
              number: 8082
      # Payment Microservice API
      - path: /api/v1/payments(.*)
        pathType: ImplementationSpecific
        backend:
          service:
            name: payment-service
            port:
              number: 8083
      # Notification Microservice API
      - path: /api/v1/notifications(.*)
        pathType: ImplementationSpecific
        backend:
          service:
            name: notification-service
            port:
              number: 8084
